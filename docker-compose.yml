version: "3.8"

services:
  webapp:
    build: .
    container_name: settlement-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"   # ERP (Streamlit)
      - "8502:8502"   # 지점 포털 (FastAPI)
    volumes:
      # ── 데이터/설정 (영구 유지) ───────────────────────────
      - ./data:/app/data
      - ./mapping:/app/mapping
      - ./static:/app/static
      - ./templates:/app/templates

      # ── Python 코드 (git pull 후 restart만으로 즉시 반영) ─
      - ./app.py:/app/app.py
      - ./branch_server.py:/app/branch_server.py
      - ./branch_app.py:/app/branch_app.py
      - ./domains:/app/domains
      - ./modules:/app/modules
      - ./shared:/app/shared
    environment:
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiYzMxYmE3Y2U3OTA1ODA0N2M1MWU1ZTJhNjY1MGI3MjEiLCJ0IjoiNWQxZDI4NDEtYWIyYS00MzY0LWFhOWQtN2M3N2E0YjhlMDU1IiwicyI6Ik1HVmlabVV6WWpNdE1HTXdOQzAwWkRZNExUZzRabVV0WldFeE1tSmtZV0V4WTJSbSJ9
    depends_on:
      - webapp
